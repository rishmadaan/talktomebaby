# Publishes the homepage (site/index.html + its assets) to GitHub Pages.
# The other pages in site/ are not published.
name: Homepage

on:
  push:
    branches: [main]
    paths:
      - site/index.html
      - site/assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage homepage
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/
          cp site/assets/icon.svg site/assets/og.png _site/assets/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
